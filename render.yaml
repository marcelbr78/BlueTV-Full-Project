services:
  - type: web
    name: bluetv-frontend
    runtime: static
    rootDir: frontend_site
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: bluetv-backend
    runtime: node
    rootDir: backend_panel
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: APP_API_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
